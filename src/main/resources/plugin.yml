name: '${name}'
version: '${version}'
description: '${description}'
main: com.itson.Mod.ModPlugin
api-version: '${apiVersion}'
author: M1HUEL
commands:
  mod:
    description: Moderation commands.
  report:
    description: Report a player to the staff.
    permission: mod.report
permissions:
  mod.report:
    description: Allows reporting players.
    default: true
  mod.report.notify:
    description: Allows receiving player reports.
    default: op
  mod.reload:
    description: Allows reloading the Mod configuration.
    default: op
  mod.warn:
    description: Allows warning players.
    default: op
  mod.ban:
    description: Allows banning and unbanning players.
    default: op
  mod.kick:
    description: Allows kicking players.
    default: op
  mod.mute:
    description: Allows muting and unmuting players.
    default: op
  mod.history:
    description: Allows viewing a player's history.
    default: op
  mod.history.clear:
    description: Allows clearing a player's whole history.
    default: op