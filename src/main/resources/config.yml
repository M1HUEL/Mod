# Maximum warnings before a player is kicked automatically.
max-warnings: 3

# Message sent to the warned player. Placeholders: {staff} and {reason}.
warn-message: "<red>You have been warned by <white>{staff}<dark_gray>: <yellow>{reason}"
# Announcement sent to the staff when a player is warned.
# Placeholders: {target}, {staff}, {reason}, {count} and {max}.
warn-broadcast: "<red>[WARN] <white>{target}<gray> was warned by <white>{staff}<gray> ({count}/{max})"

# Text used for the {expiry} placeholder when a sanction has no expiration.
permanent-text: "never"

# Screen shown to a banned player. Placeholders: {reason} and {expiry}.
ban-message: "<red>You have been banned.<newline><gray>Reason: <white>{reason}<newline><gray>Expires: <white>{expiry}"
# Announcement sent to the staff when a player is banned.
# Placeholders: {target}, {staff}, {reason} and {expiry}.
ban-broadcast: "<red>[BAN] <white>{target}<gray> was banned by <white>{staff}<dark_gray> ({reason}) <dark_gray>until <white>{expiry}"

# Screen shown to a kicked player. Placeholders: {staff} and {reason}.
kick-message: "<red>Kicked by <white>{staff}<newline><gray>Reason: <white>{reason}"
# Announcement sent to the staff when a player is kicked.
# Placeholders: {target}, {staff} and {reason}.
kick-broadcast: "<red>[KICK] <white>{target}<gray> was kicked by <white>{staff}<dark_gray> ({reason})"

# Kick reason used when the maximum number of warnings is reached.
warnings-kick-message: "<red>You have been kicked for receiving too many warnings."

# Message shown to a muted player when they try to chat. Placeholder: {reason}.
mute-message: "<red>You are muted.<newline><gray>Reason: <white>{reason}"
# Announcement sent to the staff when a player is muted.
# Placeholders: {target}, {staff}, {reason} and {expiry}.
mute-broadcast: "<red>[MUTE] <white>{target}<gray> was muted by <white>{staff}<dark_gray> ({reason}) <dark_gray>until <white>{expiry}"
# Announcement sent to the staff when a player is unmuted.
# Placeholders: {target} and {staff}.
unmute-broadcast: "<green>[UNMUTE] <white>{target}<gray> was unmuted by <white>{staff}"

# Message shown to a frozen player when they try to move.
freeze-message: "<red>You have been frozen. Do not move."
# Announcement sent to the staff when a player is frozen. Placeholders: {target} and {staff}.
freeze-broadcast: "<red>[FREEZE] <white>{target}<gray> was frozen by <white>{staff}"
# Announcement sent to the staff when a player is unfrozen. Placeholders: {target} and {staff}.
unfreeze-broadcast: "<green>[UNFREEZE] <white>{target}<gray> was unfrozen by <white>{staff}"

# Message shown to staff when toggling vanish. Placeholder: {state}.
vanish-message: "<green>Vanish {state}."

# Format used by /report. Placeholders: {player}, {target} and {reason}.
report-format: "<gold>[REPORT]<reset> <white>{player}<gray> reported <white>{target}<gray>: <white>{reason}"