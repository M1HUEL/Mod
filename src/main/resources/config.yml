# Maximum warnings before a player is kicked automatically.
max-warnings: 3
# Message sent to the warned player. Placeholders: {staff} and {reason}.
warn-message: "<red>You have been warned by <white>{staff}<dark_gray>: <yellow>{reason}"
# Screen shown to a banned player. Placeholder: {reason}.
ban-message: "<red>You have been banned.<newline><gray>Reason: <white>{reason}"
# Screen shown to a kicked player. Placeholders: {staff} and {reason}.
kick-message: "<red>Kicked by <white>{staff}<newline><gray>Reason: <white>{reason}"
# Kick reason used when the maximum number of warnings is reached.
warnings-kick-message: "<red>You have been kicked for receiving too many warnings."
# Format used by /report. Placeholders: {player}, {target} and {reason}.
report-format: "<gold>[REPORT]<reset> <white>{player}<gray> reported <white>{target}<gray>: <white>{reason}"